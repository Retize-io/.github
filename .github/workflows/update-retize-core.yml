name: Update retize-core Image

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment that protects the retize-core update.
        type: string
        required: true
      values-file:
        description: Path to the retize-core values file to update.
        type: string
        required: true
      images:
        description: >-
          One mapping per line in the form value.path=registry/image:tag. Use
          image for a root image, or api.image for a component image.
        type: string
        required: true
      branch:
        description: retize-core branch to update.
        type: string
        required: false
        default: main
      commit-message:
        description: Optional commit message.
        type: string
        required: false
        default: "chore: update application images"
      argocd-server:
        description: Argo CD server hostname and optional port.
        type: string
        required: true
      argocd-application:
        description: Argo CD Application name to wait for after the commit.
        type: string
        required: true
      argocd-timeout:
        description: Maximum Argo CD health wait in seconds.
        type: number
        required: false
        default: 900
      github-app-client-id:
        description: GitHub App client ID installed on retize-core.
        type: string
        required: true
    secrets:
      github-app-private-key:
        description: PEM private key for the GitHub App installed on retize-core.
        required: true
      argocd-auth-token:
        description: Argo CD authentication token with read access to the application.
        required: true
    outputs:
      changed:
        description: Whether the workflow created a commit.
        value: ${{ jobs.update.outputs.changed }}
      commit-sha:
        description: Commit SHA after the update.
        value: ${{ jobs.update.outputs.commit-sha }}

permissions:
  contents: read

jobs:
  update:
    name: Update retize-core
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    concurrency:
      group: retize-core-${{ inputs.branch }}
      cancel-in-progress: false
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      commit-sha: ${{ steps.commit.outputs.commit-sha }}
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.github-app-client-id }}
          private-key: ${{ secrets.github-app-private-key }}
          owner: Retize-io
          repositories: retize-core
          permission-contents: write

      - name: Checkout retize-core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Retize-io/retize-core
          ref: ${{ inputs.branch }}
          token: ${{ steps.app-token.outputs.token }}
          path: retize-core
          persist-credentials: false
          fetch-depth: 0

      - name: Update image values
        working-directory: retize-core
        env:
          VALUES_FILE: ${{ inputs['values-file'] }}
          IMAGE_MAPPINGS: ${{ inputs.images }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$VALUES_FILE" =~ ^apps/products/[a-z0-9][a-z0-9_-]*/values-[a-z0-9][a-z0-9_-]*\.ya?ml$ ]]; then
            echo "values-file must match apps/products/<product>/values-<environment>.yaml" >&2
            exit 1
          fi

          products_root="$(realpath -e -- apps/products)"
          canonical_values_file="$(realpath -e -- "$VALUES_FILE")"
          case "$canonical_values_file" in
            "$products_root"/*) ;;
            *)
              echo "values-file must resolve beneath apps/products/" >&2
              exit 1
              ;;
          esac

          test -f "$VALUES_FILE" || {
            echo "values-file does not exist: $VALUES_FILE" >&2
            exit 1
          }

          test -n "$IMAGE_MAPPINGS" || {
            echo "images must contain at least one mapping" >&2
            exit 1
          }

          declare -A seen_paths=()
          while IFS='=' read -r value_path image_reference remainder; do
            if [ -n "$remainder" ] || [ -z "$value_path" ] || [ -z "$image_reference" ]; then
              echo "Each images entry must be value.path=registry/image:tag" >&2
              exit 1
            fi

            if [[ "$value_path" == .* || "$value_path" == *. || "$value_path" == *..* || "$value_path" == */* || "$value_path" == *[^a-zA-Z0-9_.-]* ]]; then
              echo "Invalid image value path: $value_path" >&2
              exit 1
            fi

            if [ -n "${seen_paths[$value_path]+x}" ]; then
              echo "Duplicate image value path: $value_path" >&2
              exit 1
            fi
            seen_paths["$value_path"]=1

            if [[ "$image_reference" == *@* || "$image_reference" != *:* ]]; then
              echo "Image must use a tag, not a digest: $image_reference" >&2
              exit 1
            fi

            image_repository="${image_reference%:*}"
            image_tag="${image_reference##*:}"
            if [ -z "$image_repository" ] || [ -z "$image_tag" ] || [[ "$image_tag" == *[[:space:]]* ]]; then
              echo "Invalid image reference: $image_reference" >&2
              exit 1
            fi

            yq_path="."
            IFS='.' read -ra path_parts <<< "$value_path"
            for path_part in "${path_parts[@]}"; do
              yq_path+="[\"$path_part\"]"
            done

            export REPOSITORY="$image_repository"
            export TAG="$image_tag"
            existing_image="$(docker run --rm \
              --volume "$PWD:/work" \
              --workdir /work \
              --env REPOSITORY \
              --env TAG \
              --entrypoint yq \
              mikefarah/yq:4-githubaction@sha256:e1b8c865f299ea6b02910a7ddf147d5d431244d4cc116f89c2148c9f53822906 \
              eval "(${yq_path} | type == \"!!map\") and (${yq_path} | has(\"repository\") and has(\"tag\"))" "$VALUES_FILE")"
            if [ "$existing_image" != "true" ]; then
              echo "Image object with repository and tag was not found at: $value_path" >&2
              exit 1
            fi

            docker run --rm \
              --volume "$PWD:/work" \
              --workdir /work \
              --env REPOSITORY \
              --env TAG \
              --entrypoint yq \
              mikefarah/yq:4-githubaction@sha256:e1b8c865f299ea6b02910a7ddf147d5d431244d4cc116f89c2148c9f53822906 \
              eval -i "${yq_path}.repository = strenv(REPOSITORY) | ${yq_path}.tag = strenv(TAG)" "$VALUES_FILE"
          done <<< "$IMAGE_MAPPINGS"

          docker run --rm \
            --volume "$PWD:/work" \
            --workdir /work \
            --entrypoint yq \
            mikefarah/yq:4-githubaction@sha256:e1b8c865f299ea6b02910a7ddf147d5d431244d4cc116f89c2148c9f53822906 \
            eval '.' "$VALUES_FILE" >/dev/null
          git diff --check

      - name: Commit and push changes
        id: commit
        working-directory: retize-core
        env:
          COMMIT_MESSAGE: ${{ inputs['commit-message'] }}
          VALUES_FILE: ${{ inputs['values-file'] }}
          TARGET_BRANCH: ${{ inputs.branch }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          export GH_TOKEN="$APP_TOKEN"
          gh auth setup-git
          git remote set-url origin "https://github.com/Retize-io/retize-core.git"

          if git diff --quiet --; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "commit-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add -- "$VALUES_FILE"
          git commit -m "$COMMIT_MESSAGE"
          pushed=false
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${TARGET_BRANCH}"; then
              pushed=true
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Unable to push after ${attempt} attempts" >&2
              exit 1
            fi
            git fetch origin "$TARGET_BRANCH"
            if ! git rebase "origin/${TARGET_BRANCH}"; then
              git rebase --abort || true
              echo "Could not rebase the image update onto the latest retize-core/${TARGET_BRANCH}; resolve the conflicting deployment changes and retry." >&2
              exit 1
            fi
            sleep "$attempt"
          done
          [ "$pushed" = true ]

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "commit-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Wait for Argo CD health
        working-directory: retize-core
        env:
          ARGOCD_SERVER: ${{ inputs['argocd-server'] }}
          ARGOCD_APPLICATION: ${{ inputs['argocd-application'] }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.argocd-auth-token }}
          ARGOCD_TIMEOUT: ${{ inputs['argocd-timeout'] }}
          TARGET_BRANCH: ${{ inputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          application_url="${ARGOCD_SERVER%/}/api/v1/applications/${ARGOCD_APPLICATION}"
          deploy_commit="$(git rev-parse HEAD)"
          attempts=$((ARGOCD_TIMEOUT / 5))
          if [ "$attempts" -lt 1 ]; then
            echo "argocd-timeout must be at least 5 seconds" >&2
            exit 1
          fi
          for attempt in $(seq 1 "$attempts"); do
            response="$(curl --fail --silent --show-error \
              --header "Authorization: Bearer ${ARGOCD_AUTH_TOKEN}" \
              "$application_url")"
            sync_status="$(jq -r '.status.sync.status // empty' <<< "$response")"
            health_status="$(jq -r '.status.health.status // empty' <<< "$response")"
            mapfile -t revisions < <(jq -r '
              [(.status.sync.revision? // empty)] + (.status.sync.revisions? // [])
              | map(select(type == "string" and length > 0))
              | unique[]
            ' <<< "$response")
            echo "attempt=${attempt} revisions=${revisions[*]:-none} sync=${sync_status} health=${health_status}"

            if [[ "$health_status" == "Healthy" && "$sync_status" == "Synced" && "${#revisions[@]}" -gt 0 ]]; then
              git fetch origin "$TARGET_BRANCH" --quiet 2>/dev/null || true
              for revision in "${revisions[@]}"; do
                if [[ "$revision" == "$deploy_commit" ]]; then
                  exit 0
                fi
                if git cat-file -e "${revision}^{commit}" 2>/dev/null && git merge-base --is-ancestor "$deploy_commit" "$revision"; then
                  exit 0
                fi
              done
            fi
            sleep 5
          done

          echo "Argo CD did not report a synced, healthy revision containing ${deploy_commit}." >&2
          exit 1
