name: Update Core

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment that protects the retize-core update.
        type: string
        required: true
      values-file:
        description: Path to the retize-core values file to update.
        type: string
        required: true
      images:
        description: >-
          One mapping per line in the form value.path=registry/image:tag. Use
          image for a root image, or api.image for a component image.
        type: string
        required: true
      branch:
        description: retize-core branch to update.
        type: string
        required: false
        default: main
      commit-message:
        description: Optional commit message.
        type: string
        required: false
        default: "chore: update application images"
      create-pull-request:
        description: Create a promotion PR instead of committing directly to the target branch.
        type: boolean
        required: false
        default: false
      github-app-client-id:
        description: GitHub App client ID installed on retize-core.
        type: string
        required: true
    secrets:
      github-app-private-key:
        description: PEM private key for the GitHub App installed on retize-core.
        required: true
    outputs:
      changed:
        description: Whether the workflow created a commit.
        value: ${{ jobs.update.outputs.changed }}
      commit-sha:
        description: Commit SHA after the update.
        value: ${{ jobs.update.outputs.commit-sha }}
      pull-request-url:
        description: Promotion PR URL when create-pull-request is enabled.
        value: ${{ jobs.update.outputs.pull-request-url }}

permissions:
  contents: read

jobs:
  update:
    name: Update
    runs-on: ubuntu-24.04
    concurrency:
      group: retize-core-${{ inputs.branch }}
      cancel-in-progress: false
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      commit-sha: ${{ steps.commit.outputs.commit-sha }}
      pull-request-url: ${{ steps.commit.outputs.pull-request-url }}
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.github-app-client-id }}
          private-key: ${{ secrets.github-app-private-key }}
          owner: Retize-io
          repositories: retize-core
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout retize-core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Retize-io/retize-core
          ref: ${{ inputs.branch }}
          token: ${{ steps.app-token.outputs.token }}
          path: retize-core
          persist-credentials: false
          fetch-depth: 0

      - name: Prepare promotion branch
        if: inputs['create-pull-request']
        working-directory: retize-core
        env:
          PROMOTION_BRANCH: promotion/${{ github.repository }}/${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: git switch -c "$PROMOTION_BRANCH"

      - name: Update image values
        working-directory: retize-core
        env:
          VALUES_FILE: ${{ inputs['values-file'] }}
          IMAGE_MAPPINGS: ${{ inputs.images }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$VALUES_FILE" =~ ^apps/products/[a-z0-9][a-z0-9_-]*/values-[a-z0-9][a-z0-9_-]*\.ya?ml$ ]]; then
            echo "values-file must match apps/products/<product>/values-<environment>.yaml" >&2
            exit 1
          fi

          products_root="$(realpath -e -- apps/products)"
          canonical_values_file="$(realpath -e -- "$VALUES_FILE")"
          case "$canonical_values_file" in
            "$products_root"/*) ;;
            *)
              echo "values-file must resolve beneath apps/products/" >&2
              exit 1
              ;;
          esac

          test -f "$VALUES_FILE" || {
            echo "values-file does not exist: $VALUES_FILE" >&2
            exit 1
          }

          test -n "$IMAGE_MAPPINGS" || {
            echo "images must contain at least one mapping" >&2
            exit 1
          }

           declare -A seen_paths=()
           promotion_version=""
           while IFS='=' read -r value_path image_reference remainder; do
            if [ -z "$value_path$image_reference$remainder" ]; then
              continue
            fi
            if [ -n "$remainder" ] || [ -z "$value_path" ] || [ -z "$image_reference" ]; then
              echo "Each images entry must be value.path=registry/image:tag" >&2
              exit 1
            fi

            if [[ "$value_path" == .* || "$value_path" == *. || "$value_path" == *..* || "$value_path" == */* || "$value_path" == *[^a-zA-Z0-9_.]* ]]; then
              echo "Invalid image value path: $value_path" >&2
              exit 1
            fi

            if [ -n "${seen_paths[$value_path]+x}" ]; then
              echo "Duplicate image value path: $value_path" >&2
              exit 1
            fi
            seen_paths["$value_path"]=1

            if [[ "$image_reference" == *@* || "$image_reference" != *:* ]]; then
              echo "Image must use a tag, not a digest: $image_reference" >&2
              exit 1
            fi

             image_repository="${image_reference%:*}"
             image_tag="${image_reference##*:}"
            if [ -z "$image_repository" ] || [ -z "$image_tag" ] || [[ "$image_tag" == *[[:space:]]* ]]; then
              echo "Invalid image reference: $image_reference" >&2
               exit 1
             fi
             if [ -z "$promotion_version" ]; then
               promotion_version="$image_tag"
             fi

            yq_path=".${value_path}"

            export REPOSITORY="$image_repository"
            export TAG="$image_tag"
            existing_repository="$(docker run --rm \
              --volume "$PWD:/work" \
              --workdir /work \
              --entrypoint yq \
              mikefarah/yq:4-githubaction@sha256:e1b8c865f299ea6b02910a7ddf147d5d431244d4cc116f89c2148c9f53822906 \
              eval -r "${yq_path}.repository // \"\"" "$VALUES_FILE")"
            existing_tag="$(docker run --rm \
              --volume "$PWD:/work" \
              --workdir /work \
              --entrypoint yq \
              mikefarah/yq:4-githubaction@sha256:e1b8c865f299ea6b02910a7ddf147d5d431244d4cc116f89c2148c9f53822906 \
              eval -r "${yq_path}.tag // \"\"" "$VALUES_FILE")"
            if [ -z "$existing_repository" ] || [ -z "$existing_tag" ]; then
              echo "Image object with repository and tag was not found at: $value_path (repository='$existing_repository', tag='$existing_tag')" >&2
              exit 1
            fi

            docker run --rm \
              --volume "$PWD:/work" \
              --workdir /work \
              --env REPOSITORY \
              --env TAG \
              --entrypoint yq \
              mikefarah/yq:4-githubaction@sha256:e1b8c865f299ea6b02910a7ddf147d5d431244d4cc116f89c2148c9f53822906 \
              eval -i "${yq_path}.repository = strenv(REPOSITORY) | ${yq_path}.tag = strenv(TAG)" "$VALUES_FILE"
          done <<< "$IMAGE_MAPPINGS"

          docker run --rm \
            --volume "$PWD:/work" \
            --workdir /work \
            --entrypoint yq \
            mikefarah/yq:4-githubaction@sha256:e1b8c865f299ea6b02910a7ddf147d5d431244d4cc116f89c2148c9f53822906 \
            eval '.' "$VALUES_FILE" >/dev/null
          git diff --check

      - name: Commit and push changes
        id: commit
        working-directory: retize-core
        env:
          COMMIT_MESSAGE: ${{ inputs['commit-message'] }}
          VALUES_FILE: ${{ inputs['values-file'] }}
          TARGET_BRANCH: ${{ inputs.branch }}
          CREATE_PR: ${{ inputs['create-pull-request'] }}
          PROMOTION_BRANCH: promotion/${{ github.repository }}/${{ github.run_id }}-${{ github.run_attempt }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
          IMAGE_MAPPINGS: ${{ inputs.images }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          export GH_TOKEN="$APP_TOKEN"
          gh auth setup-git
           git remote set-url origin "https://github.com/Retize-io/retize-core.git"

           application_name="${GITHUB_REPOSITORY##*/}"
           first_mapping="${IMAGE_MAPPINGS%%$'\n'*}"
           first_image_reference="${first_mapping#*=}"
           promotion_version="${first_image_reference##*:}"
           commit_message="$COMMIT_MESSAGE"
           if [ "$commit_message" = "chore: update application images" ]; then
             commit_message="deploy(${application_name}): promote ${promotion_version} to ${DEPLOYMENT_ENVIRONMENT}"
           fi

          if git diff --quiet --; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "commit-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "pull-request-url=" >> "$GITHUB_OUTPUT"
            exit 0
           fi

           git add -- "$VALUES_FILE"
           git commit -m "$commit_message"
           if [ "$CREATE_PR" = true ]; then
             git push origin "HEAD:${PROMOTION_BRANCH}"
            pr_url="$(gh pr list --repo Retize-io/retize-core --head "$PROMOTION_BRANCH" --state open --json url --jq '.[0].url // empty')"
            if [ -z "$pr_url" ]; then
               pr_body=$(printf '## Deployment promotion\n\nEnvironment: `%s`\nValues file: `%s`\n\n### Image updates\n```text\n%s\n```\n\nThis PR was created by `%s` from [%s]. Merge this PR to promote the image.' "$DEPLOYMENT_ENVIRONMENT" "$VALUES_FILE" "$IMAGE_MAPPINGS" "$GITHUB_REPOSITORY" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
               pr_title="deploy: ${application_name} ${promotion_version} to ${DEPLOYMENT_ENVIRONMENT}"
               pr_url="$(gh pr create --repo Retize-io/retize-core --base "$TARGET_BRANCH" --head "$PROMOTION_BRANCH" --title "$pr_title" --body "$pr_body")"
            fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "commit-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "pull-request-url=$pr_url" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pushed=false
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${TARGET_BRANCH}"; then
              pushed=true
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Unable to push after ${attempt} attempts" >&2
              exit 1
            fi
            git fetch origin "$TARGET_BRANCH"
            if ! git rebase "origin/${TARGET_BRANCH}"; then
              git rebase --abort || true
              echo "Could not rebase the image update onto the latest retize-core/${TARGET_BRANCH}; resolve the conflicting deployment changes and retry." >&2
              exit 1
            fi
            sleep "$attempt"
          done
          [ "$pushed" = true ]

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "commit-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "pull-request-url=" >> "$GITHUB_OUTPUT"
