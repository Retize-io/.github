name: Deploy Development

on:
  workflow_call:
    inputs:
      image-name:
        description: Optional full GHCR image name. Defaults to the calling repository.
        type: string
        required: false
      context:
        description: Docker build context.
        type: string
        required: false
        default: .
      dockerfile:
        description: Path to the Dockerfile.
        type: string
        required: false
        default: Dockerfile
      version:
        description: Optional version tag to apply.
        type: string
        required: false
      build-args:
        description: Optional newline-separated Docker build arguments.
        type: string
        required: false
        default: ""
      values-file:
        description: retize-core values file to update.
        type: string
        required: true
      image-value-path:
        description: Dot-separated image object path in the values file.
        type: string
        required: false
        default: image
      argocd-server:
        description: Argo CD base URL.
        type: string
        required: true
      argocd-application:
        description: Argo CD Application name to verify.
        type: string
        required: true
      argocd-timeout:
        description: Maximum Argo CD health wait in seconds.
        type: number
        required: false
        default: 900
      github-app-client-id:
        description: GitHub App client ID installed on retize-core.
        type: string
        required: true
    secrets:
      github-app-private-key:
        description: GitHub App private key for retize-core.
        required: true
      argocd-auth-token:
        description: Argo CD read token.
        required: true
    outputs:
      image-path:
        description: Immutable image reference produced by the build.
        value: ${{ jobs.build.outputs.image-path }}
      digest:
        description: Published image digest.
        value: ${{ jobs.build.outputs.digest }}
      retize-core-commit-sha:
        description: retize-core commit after promotion.
        value: ${{ jobs.promote.outputs.commit-sha }}

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      image-name: ${{ inputs['image-name'] }}
      context: ${{ inputs.context }}
      dockerfile: ${{ inputs.dockerfile }}
      version: ${{ inputs.version }}
      build-args: ${{ inputs['build-args'] }}

  promote:
    needs: build
    uses: ./.github/workflows/update-retize-core.yml
    permissions:
      contents: read
    with:
      environment: development
      values-file: ${{ inputs['values-file'] }}
      images: |
        ${{ inputs['image-value-path'] }}=${{ needs.build.outputs.image-path }}
      argocd-server: ${{ inputs['argocd-server'] }}
      argocd-application: ${{ inputs['argocd-application'] }}
      argocd-timeout: ${{ inputs['argocd-timeout'] }}
      github-app-client-id: ${{ inputs['github-app-client-id'] }}
    secrets:
      github-app-private-key: ${{ secrets.github-app-private-key }}
      argocd-auth-token: ${{ secrets.argocd-auth-token }}
