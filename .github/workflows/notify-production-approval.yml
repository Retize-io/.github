name: Notify Prod

on:
  workflow_call:
    inputs:
      environment:
        description: Target deployment environment, e.g. production.
        type: string
        required: true
      product:
        description: Product or application name.
        type: string
        required: true
      component:
        description: Component within a product, e.g. api or worker.
        type: string
        required: false
      image-reference:
        description: Image reference to deploy, e.g. ghcr.io/retize-io/my-api:sha-abc1234.
        type: string
        required: true
      approval-url:
        description: Pull request or workflow URL where approval should happen.
        type: string
        required: true
    secrets:
      discord-webhook-url:
        description: Discord webhook URL for deployment notifications.
        required: true

permissions:
  contents: read

jobs:
  notify:
    name: Send
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord approval embed
        env:
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
          PRODUCT: ${{ inputs.product }}
          COMPONENT: ${{ inputs.component }}
          IMAGE_REFERENCE: ${{ inputs['image-reference'] }}
          SOURCE_COMMIT: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          APPROVAL_URL: ${{ inputs['approval-url'] }}
          DISCORD_WEBHOOK_URL: ${{ secrets.discord-webhook-url }}
        shell: bash
        run: |
          set -euo pipefail
          component_label="${COMPONENT:-all components}"
          commit_url="https://github.com/${REPOSITORY}/commit/${SOURCE_COMMIT}"
          payload="$(jq -n \
            --arg title "Production deployment approval required" \
            --arg url "$APPROVAL_URL" \
            --arg product "$PRODUCT" \
            --arg component "$component_label" \
            --arg environment "$DEPLOYMENT_ENVIRONMENT" \
            --arg image "$IMAGE_REFERENCE" \
            --arg commit "$SOURCE_COMMIT" \
            --arg commit_url "$commit_url" \
            --arg actor "$ACTOR" \
            --arg repository "$REPOSITORY" \
            '{embeds: [{title: $title, url: $url, color: 16753920, fields: [
              {name: "Product", value: $product, inline: true},
              {name: "Component", value: $component, inline: true},
              {name: "Environment", value: $environment, inline: true},
              {name: "Image", value: ("`" + $image + "`"), inline: false},
              {name: "Source commit", value: ("[" + ($commit[0:7]) + "](" + $commit_url + ")"), inline: true},
              {name: "Repository", value: $repository, inline: true},
              {name: "Requested by", value: $actor, inline: true}
             ], description: ("[Review and approve this promotion](" + $url + ") in retize-core.")}]}')"
          if [ "${#payload}" -gt 5900 ]; then
            echo "Generated Discord embed exceeds the Discord payload limit" >&2
            exit 1
          fi
          curl --fail --silent --show-error \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "$DISCORD_WEBHOOK_URL"
