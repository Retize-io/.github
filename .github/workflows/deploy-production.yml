name: Deploy Production

on:
  workflow_call:
    inputs:
      image-name:
        description: Optional full GHCR image name. Defaults to the calling repository.
        type: string
        required: false
      context:
        description: Docker build context.
        type: string
        required: false
        default: .
      dockerfile:
        description: Path to the Dockerfile.
        type: string
        required: false
        default: Dockerfile
      version:
        description: Optional version tag to apply.
        type: string
        required: false
      build-args:
        description: Optional newline-separated Docker build arguments.
        type: string
        required: false
        default: ""
      values-file:
        description: retize-core values file to update.
        type: string
        required: true
      image-value-path:
        description: Dot-separated image object path in the values file.
        type: string
        required: false
        default: image
      product:
        description: Product name shown in the approval notification.
        type: string
        required: true
      component:
        description: Optional component name shown in the approval notification.
        type: string
        required: false
      github-app-client-id:
        description: GitHub App client ID installed on retize-core.
        type: string
        required: true
    secrets:
      discord-webhook-url:
        description: Discord deployment notification webhook.
        required: true
      github-app-private-key:
        description: GitHub App private key for retize-core.
        required: true
    outputs:
      image-path:
        description: Immutable image reference produced by the build.
        value: ${{ jobs.build.outputs.image-path }}
      digest:
        description: Published image digest.
        value: ${{ jobs.build.outputs.digest }}
      retize-core-commit-sha:
        description: retize-core commit after promotion.
        value: ${{ jobs.promote.outputs.commit-sha }}
      promotion-pr-url:
        description: retize-core promotion PR URL.
        value: ${{ jobs.promote.outputs.pull-request-url }}

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    uses: Retize-io/.github/.github/workflows/build-image.yml@v1.0.1
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      image-name: ${{ inputs['image-name'] }}
      context: ${{ inputs.context }}
      dockerfile: ${{ inputs.dockerfile }}
      version: ${{ inputs.version }}
      build-args: ${{ inputs['build-args'] }}

  notify:
    needs: [build, promote]
    if: needs.promote.outputs.changed == 'true'
    uses: Retize-io/.github/.github/workflows/notify-production-approval.yml@v1.0.1
    permissions:
      contents: read
    with:
      environment: production
      product: ${{ inputs.product }}
      component: ${{ inputs.component }}
      image-reference: ${{ needs.build.outputs.image-path }}
      approval-url: ${{ needs.promote.outputs.pull-request-url }}
    secrets:
      discord-webhook-url: ${{ secrets.discord-webhook-url }}

  promote:
    needs: build
    uses: Retize-io/.github/.github/workflows/update-retize-core.yml@v1.0.1
    permissions:
      contents: read
    with:
      environment: production
      create-pull-request: true
      values-file: ${{ inputs['values-file'] }}
      images: |
        ${{ inputs['image-value-path'] }}=${{ needs.build.outputs.image-path }}
      github-app-client-id: ${{ inputs['github-app-client-id'] }}
    secrets:
      github-app-private-key: ${{ secrets.github-app-private-key }}
