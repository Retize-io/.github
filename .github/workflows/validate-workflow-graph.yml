name: Validate Workflow Graph

on:
  push:
    branches:
      - main
      - v1
    tags:
      - v*
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install actionlint
        shell: bash
        run: |
          set -euo pipefail
          version=v1.7.12
          archive="actionlint_${version#v}_linux_amd64.tar.gz"
          gh release download "$version" --repo rhysd/actionlint --pattern "$archive" --dir "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Validate workflow syntax
        run: actionlint .github/workflows/*.yml

      - name: Validate reusable workflow graph
        run: .github/scripts/validate-workflow-graph.sh
